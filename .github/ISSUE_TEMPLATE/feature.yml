name: Idea
description: Something Twichat should do, or should do differently.
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The situation first, the feature second — the problem often has a simpler answer than the solution it suggests.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround, another client, or nothing at all.
  - type: textarea
    id: shape
    attributes:
      label: What you picture
      description: Optional. A rough shape is fine.
