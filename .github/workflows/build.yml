name: Build

# On a v* tag: build and package for the three operating systems, then publish
# ONE GitHub release holding the four installers. Also runnable by hand, which
# produces the artifacts alone. Builds are unsigned for now, so no secret is
# needed and GITHUB_TOKEN is enough.
#
# The two stages are deliberately kept apart: the build jobs run in parallel and
# do nothing but drop artifacts, then a single job creates the release. Without
# that split the three jobs would each try to create the same release at the
# same time, a race that can fail a job or publish twice.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The architecture is named rather than inherited from the runner. `--mac` alone means
          # whatever the runner happens to be — arm64 today — which shipped no Intel build at all
          # without ever saying so; `--universal` is one disk image that runs on both.
          - os: macos-latest
            platform: '--mac --universal'
          - os: windows-latest
            platform: '--win --x64'
          - os: ubuntu-latest
            platform: '--linux --x64 --arm64'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Before anything is installed or packaged: a tag that does not name the version in
      # package.json would publish installers announcing a version the release never had, and
      # the in-app update check compares against exactly that.
      - name: Tag and version agree
        if: startsWith(github.ref, 'refs/tags/')
        # bash on every runner, Windows included: the default shell there is PowerShell, where
        # `$GITHUB_REF` reads an undefined PowerShell variable rather than the environment, and
        # the gate would refuse an empty ref on a tag that is perfectly good.
        shell: bash
        run: node scripts/release-gate.mjs "$GITHUB_REF"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: RPM tooling (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package ${{ matrix.platform }}
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The blockmaps and latest*.yml are what the in-app update check reads: an installer
      # published without them is a release the running app can never see.
      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twichat-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/latest*.yml
          # A packaging step that produced nothing must not pass for a build with nothing to
          # package: that is how a release ships missing an installer and nobody notices.
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the three OS installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # What a download can be checked against, for anyone who wants to. The file lists the
      # installers by the names the site serves them under, which are the names they were built
      # with — see `artifactName` in electron-builder.yml.
      - name: Checksums
        run: cd dist && sha256sum *.dmg *.exe *.deb *.rpm > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SHA256SUMS.txt
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/latest*.yml
          fail_on_unmatched_files: true
